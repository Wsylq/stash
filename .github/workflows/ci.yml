name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --include-workspace-root

      - name: Build shared types
        run: npm run build --workspace @stash/shared

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: API integration tests
        run: npm run test --workspace @stash/api

      - name: Build API
        run: npm run build --workspace @stash/api

      - name: Build web (Next.js PWA)
        run: npm run build --workspace @stash/web