name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      stash_url:
        description: 'Stash instance URL the APK should open (e.g. https://stash.example.com or http://192.168.1.10:3000)'
        required: false
        default: 'https://your-stash.example.com'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null 2>&1 || true
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PstashUrl="${{ inputs.stash_url }}" --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stash-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          overwrite: true